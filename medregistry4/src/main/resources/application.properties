spring.application.name=Medregistry

server.port=8080

#spring.datasource.url=jdbc:postgresql://localhost:5433/hospitaldb
spring.datasource.url=jdbc:postgresql://postgres:5432/hospitaldb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Lzmf2000}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Liquibase
spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public
spring.liquibase.default-schema=public

# Thymeleaf
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

# Cache configuration ?????????? ??????? ConcurrentMap ???
spring.cache.type=simple
spring.cache.cache-names=doctors,patients

# Actuator
management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

# ????? ????????? ?????????? ????????? ????
management.metrics.enable.cache=true
management.metrics.cache.instrument=true

# ??????????? ??? ???????
logging.level.io.micrometer=DEBUG

# ????????? ??????????? ???????????
logging.level.org.springframework.cache=DEBUG
logging.level.org.aspectj=DEBUG
logging.level.your.package=TRACE
logging.level.ru.natali.medregistry.aop=DEBUG







