<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Меню пиццерии</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .pizza-card {
            margin-bottom: 20px;
            transition: transform 0.3s;
        }
        .pizza-card:hover {
            transform: scale(1.03);
        }
        .pizza-img {
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>

<form th:action="@{/logout}" method="POST" class="d-inline">
    <button type="submit" class="btn btn-outline-danger">Выйти</button>
</form>

<div class="container mt-4">
    <h1 class="text-center mb-4">Наше меню</h1>

    <div class="row">
        <div th:each="pizza : ${pizzas}" class="col-md-4">
            <div class="card pizza-card">
                <img th:src="@{'/images/' + ${pizza.imageUrl}}"
                     th:alt="${pizza.name}"
                     class="card-img-top pizza-img">
                <div class="card-body">
                    <h5 class="card-title" th:text="${pizza.name}"></h5>
                    <p class="card-text" th:text="${pizza.description}"></p>
                    <p class="text-muted" th:text="'Время приготовления: ' + ${pizza.cookingTimeMin} + ' мин'"></p>
                    <h6 class="text-success" th:text="${pizza.price} + ' ₽'"></h6>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
