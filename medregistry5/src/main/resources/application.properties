spring.application.name=Medregistry

server.port=8080

spring.datasource.url=jdbc:postgresql://localhost:5433/hospitaldb
#spring.datasource.url=jdbc:postgresql://postgres:5432/hospitaldb
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Lzmf2000}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.liquibase-schema=public
spring.liquibase.default-schema=public

spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8

spring.cache.type=simple
spring.cache.cache-names=doctors,patients

management.endpoints.web.exposure.include=*
management.endpoint.health.show-details=always

management.metrics.enable.cache=true
management.metrics.cache.instrument=true

logging.level.io.micrometer=DEBUG

logging.level.org.springframework.cache=DEBUG
logging.level.org.aspectj=DEBUG
logging.level.your.package=TRACE
logging.level.ru.natali.medregistry.aop=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=medregistry-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.template.default-topic=doctor-events

spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.trusted.packages=*

spring.kafka.consumer.properties.spring.json.value.default.type=ru.natali.medregistry.model.PatientEvent

spring.kafka.consumer.properties.spring.json.use.type.headers=false




